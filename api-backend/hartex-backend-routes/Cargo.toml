[package]
name = "hartex_backend_routes"
version = "0.16.0"
edition = "2024"
description = """
Backend routes (API v1)
"""
license = "AGPL-3.0-or-later"
rust-version = "1.92.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
hartex_backend_models = { path = "../hartex-backend-models" }

hartex_database_queries = { path = "../../database/hartex-database-queries" }

hartex_discord_utils = { path = "../../rust-utilities/hartex-discord-utils" }
hartex-tracing = { path = "../../rust-utilities/hartex-tracing" }

axum = { version = "0.8.6", features = ["json", "macros"] }
axum-extra = { version = "0.12.1", features = ["with-rejection"] }
chrono = "0.4.42"
tracing = "0.1.41"
utoipa = "5.4.0"

[features]

[workspace]
members = [
    "bot/gateway",
    "protocol",
    "shared/tracing",
    "shared/types"
]
resolver = "3"

[workspace.package]
version = "0.17.0"
edition = "2024"
authors = ["HarTex Project Developers"]
license = "AGPL-3"

[workspace.dependencies]
async-nats = "0.50.0"
config = "0.15.25"
futures-util = "0.3.34"
prost = "0.14.4"
prost-build = "0.14.4"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-core = "0.1.36"
tracing-error = "0.2.1"
tracing-subscriber = "0.3.23"
twilight-gateway = { git = "https://github.com/twilight-rs/twilight.git" }
twilight-http = { git = "https://github.com/twilight-rs/twilight.git" }
twilight-model = { git = "https://github.com/twilight-rs/twilight.git" }

protocol = { path = "protocol" }
shared-tracing = { path = "shared/tracing" }
shared-types = { path = "shared/types" }

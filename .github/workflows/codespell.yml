name: Lints (Rust)

on:
  workflow_dispatch:
  pull_request:
    branches:
      - nightly

env:
  CARGO_TERM_COLOR: always

jobs:
  codespell:
    name: CodeSpell
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Run CodeSpell
        uses: codespell-project/actions-codespell@master

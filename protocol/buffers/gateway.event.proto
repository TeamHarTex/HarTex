syntax = "proto3";

package gateway.event;

message GatewayEvent {
  uint32 shard_id = 1;
  optional uint64 sequence = 2;

  oneof body {
    RawEvent raw = 10;
  }
}

message RawEvent {
  string kind = 1;
  bytes json = 2;
}

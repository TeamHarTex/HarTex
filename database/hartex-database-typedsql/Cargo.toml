[package]
name = "hartex_database_typedsql"
version = "0.15.0"
edition = "2024"
description = """
A typed Rust code generator from SQL queries and schema.
"""
license = "AGPL-3.0-or-later"
rust-version = "1.92.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
convert_case = "0.8.0"
itertools = "0.14.0"
prettyplease = "0.2.37"
proc-macro2 = "1.0.101"
quote = "1.0.41"
sqlparser = { version = "0.59.0", features = ["visitor"] }
syn = { version = "2.0.106", features = ["full", "parsing", "proc-macro"] }
walkdir = "2.5.0"

[build-dependencies]

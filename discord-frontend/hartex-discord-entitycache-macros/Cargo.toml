[package]
name = "hartex_discord_entitycache_macros"
version = "0.15.0"
edition = "2024"
description = """
Macros for the command framework.
"""
license = "AGPL-3.0-or-later"
rust-version = "1.90.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
hartex_macro_utils = { path = "../../rust-utilities/hartex-macro-utils" }

convert_case = "0.8.0"
itertools = "0.14.0"
lazy_static = "1.5.0"
pluralizer = "0.5.0"
proc-macro2 = "1.0.95"
quote = "1.0.40"
syn = { version = "2.0.104", features = ["extra-traits", "full"] }

[build-dependencies]
convert_case = "0.8.0"
proc-macro2 = "1.0.95"
quote = "1.0.40"
reqwest = { version = "0.12.21", features = ["blocking"] }
syn = { version = "2.0.104", features = ["extra-traits", "full"] }
zip = { version = "4.2.0" }

[features]
default = ["discord_model_v_0_15_4"]
discord_model_v_0_15_4 = []
discord_model_git = []

[lib]
name = "hartex_discord_entitycache_macros"
proc-macro = true

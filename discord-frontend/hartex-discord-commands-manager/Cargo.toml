[package]
name = "hartex_discord_commands_manager"
version = "0.15.0"
edition = "2024"
description = """
The commands manager of the bot.
"""
license = "AGPL-3.0-or-later"
rust-version = "1.92.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
hartex_discord_core = { path = "../hartex-discord-core", features = [
    "async-net",
    "async-runtime",
    "discord-model",
    "environment",
] }

hartex_discord_utils = { path = "../../rust-utilities/hartex-discord-utils" }
hartex_tracing = { path = "../../rust-utilities/hartex-tracing" }

clap = "4.5.48"
hyper = { version = "1.7.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.17", features = ["http1", "tokio"] }
http-body-util = "0.1.3"
miette = { version = "7.6.0", features = ["fancy"] }
minify = "1.3.0"
owo-colors = "4.2.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tracing = "0.1.41"
walkdir = "2.5.0"

[features]

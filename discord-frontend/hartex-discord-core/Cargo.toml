[package]
name = "hartex_discord_core"
version = "0.16.0"
edition = "2024"
description = """
The core library of the bot.
"""
license = "AGPL-3.0-or-later"
rust-version = "1.92.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
dotenvy = { version = "0.15.7", optional = true }
tokio = { version = "1.47.1", optional = true }
twilight-cache-inmemory = { git = "https://github.com/twilight-rs/twilight.git", branch = "erk/uikit", optional = true }
twilight-gateway = { git = "https://github.com/twilight-rs/twilight.git", branch = "erk/uikit", optional = true }
twilight-http = { git = "https://github.com/twilight-rs/twilight.git", branch = "erk/uikit", optional = true }
twilight-mention = { git = "https://github.com/twilight-rs/twilight.git", branch = "erk/uikit", optional = true }
twilight-model = { git = "https://github.com/twilight-rs/twilight.git", branch = "erk/uikit", optional = true }
twilight-util = { git = "https://github.com/twilight-rs/twilight.git", branch = "erk/uikit", optional = true }

[features]
async-net = ["dep:tokio", "tokio?/net"]
async-runtime = [
    "dep:tokio",
    "tokio?/macros",
    "tokio?/rt",
    "tokio?/rt-multi-thread",
]
async-signal = ["dep:tokio", "tokio?/signal"]
async-sync = ["dep:tokio", "tokio?/sync"]
discord-cache = ["dep:twilight-cache-inmemory"]
discord-gateway = ["dep:twilight-gateway"]
discord-gateway-enable-http = ["twilight-gateway?/twilight-http"]
discord-http = ["dep:twilight-http"]
discord-mention = ["dep:twilight-mention"]
discord-model = ["dep:twilight-model"]
discord-util = ["dep:twilight-util"]
discord-util-builder = ["twilight-util?/builder"]
discord-util-snowflake = ["twilight-util?/snowflake"]
environment = ["dep:dotenvy"]

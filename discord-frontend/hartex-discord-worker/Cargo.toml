[package]
name = "hartex_discord_worker"
version = "0.15.0"
edition = "2024"
description = """
The worker component of the bot.
"""
license = "AGPL-3.0-or-later"
rust-version = "1.91.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
hartex_backend_models = { path = "../../api-backend/hartex-backend-models" }

hartex_discord_commands = { path = "../hartex-discord-commands" }
hartex_discord_commands_core = { path = "../hartex-discord-commands-core" }
hartex_discord_core = { path = "../hartex-discord-core", features = [
    "async-runtime",
    "async-signal",
    "async-sync",
    "discord-cache",
    "discord-model",
    "environment",
] }
hartex_discord_grpc_protos = { path = "../hartex-discord-grpc-protos", features = ["gateway"] }

hartex_localization_core = { path = "../../localization/hartex-localization-core" }

hartex_discord_utils = { path = "../../rust-utilities/hartex-discord-utils" }
hartex_tracing = { path = "../../rust-utilities/hartex-tracing" }

bytes = "1.10.1"
chrono = { version = "0.4.41", features = ["clock"], default-features = false }
futures-util = "0.3.31"
hyper = { version = "1.6.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.16", features = ["tokio"] }
miette = { version = "7.6.0", features = ["fancy"] }
mimalloc = "0.1.47"
parking_lot = "0.12.4"
serde = "1.0.219"
serde_json = "1.0.141"
sha2 = "0.11.0-rc.0"
strip-ansi-escapes = "0.2.1"
tokio-stream = "0.1.17"
tonic = "0.14.0"
tonic-reflection = { version = "0.14.0", features = ["server"] }
tracing = "0.1.41"

[features]

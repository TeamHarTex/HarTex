[package]
name = "hartex_discord_commands"
version = "0.16.0"
edition = "2024"
description = """
Commands for the bot.
"""
license = "AGPL-3.0-or-later"
rust-version = "1.92.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
hartex_backend_models = { path = "../../api-backend/hartex-backend-models" }

hartex_database_queries = { path = "../../database/hartex-database-queries" }

hartex_discord_cdn = { path = "../hartex-discord-cdn" }
hartex_discord_core = { path = "../hartex-discord-core", features = [
    "async-net",
    "discord-http",
    "discord-mention",
    "discord-model",
    "discord-util",
    "discord-util-builder",
    "discord-util-snowflake",
] }
hartex_discord_commands_core = { path = "../hartex-discord-commands-core", features = [
    "derive",
] }

hartex_async_lazy = { path = "../../rust-utilities/hartex-async-lazy" }
hartex_discord_utils = { path = "../../rust-utilities/hartex-discord-utils" }
hartex_tracing = { path = "../../rust-utilities/hartex-tracing" }

async-lazy = "0.1.2"
async-trait = "0.1.89"
formati = "0.1.4"
http-body-util = "0.1.3"
hyper = { version = "1.7.0", features = ["client", "http2"] }
hyper-util = { version = "0.1.17", features = ["http2", "tokio"] }
itertools = "0.14.0"
i18n-embed = { version = "0.16.0", features = ["fluent-system"] }
i18n-embed-fl = "0.10.0"
miette = "7.6.0"
rand = "0.9.2"
regex = "1.11.3"
rust-embed = "8.8.0"
serde_json = "1.0.145"
tracing = "0.1.41"

[features]

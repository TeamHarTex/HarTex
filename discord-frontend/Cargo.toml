[workspace]
members = [
    "hartex-discord-actors",
    "hartex-discord-envconf",
    "hartex-discord-grpc",
    "hartex-discord-manager",
    "hartex-discord-tui",
    "hartex-discord-utils",
    "hartex-discord-worker"
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.96.0"
version = "0.17.0"

[workspace.dependencies]
async-nats = "0.50.0"
clap = { version = "4.6.1", features = ["color", "derive", "suggestions"] }
color-eyre = "0.6.5"
config = { version = "0.15.23", default-features = false }
crossterm = { version =  "0.29.0", features = ["event-stream"] }
dashmap = "7.0.0-rc2"
dur = "0.5.3"
dyn-clone = "1.0.20"
futures = "0.3.32"
kameo = { version = "0.22.0", features = ["tracing"] }
mimalloc = "0.1.52"
prost = "0.14.3"
ratatui = "0.30.0"
rustls = "0.23.40"
serde = { version = "1.0.228", features = ["derive"] }
simd-json = "0.18.0"
strum = { version = "0.28.0", features = ["derive"] }
time = "0.3.47"
tokio = { version = "1.52.3", features = ["macros", "rt", "rt-multi-thread", "signal", "time"] }
tokio-util = "0.7.18"
tonic = "0.14.6"
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = "0.3.23"
twilight-gateway = "0.17.1"
twilight-http = "0.17.1"
twilight-model = "0.17.1"

hartex-discord-actors = { path = "hartex-discord-actors" }
hartex-discord-envconf = { path = "hartex-discord-envconf" }
hartex-discord-grpc = { path = "hartex-discord-grpc" }
hartex-discord-utils = { path = "hartex-discord-utils" }
hartex-termios-utils = { path = "../rust-utilities/hartex-termios-utils" }
hartex-tracing = { path = "../rust-utilities/hartex-tracing" }
hartex-version = { path = "../rust-utilities/hartex-version" }

[workspace.lints.clippy]
allow_attributes_without_reason = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
pedantic = { level = "deny", priority = -1 }
struct_field_names = "allow"

[workspace.lints.rust]
unfulfilled_lint_expectations = "forbid"
unsafe_code = "forbid"
warnings = "deny"

[profile.dev.package.backtrace]
opt-level = 3

[profile.release]
codegen-units = 1
debug = true
lto = "fat"

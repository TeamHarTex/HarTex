[workspace]
members = [
    "hartex-discord-actors",
    "hartex-discord-leader",
    "hartex-discord-utils",
    "hartex-discord-worker"
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.94.0"
version = "0.17.0"

[workspace.dependencies]
color-eyre = "0.6.5"
futures = "0.3.31"
git-version = "0.3.9"
kameo = { version = "0.19.2", features = ["tracing", "remote"] }
mimalloc = "0.1.48"
time = "0.3.44"
tokio = { version = "1.48.0", features = ["macros", "rt", "rt-multi-thread", "signal"] }
tracing = "0.1.44"
twilight-gateway = "0.17.1"
twilight-http = "0.17.1"
twilight-model = "0.17.1"

hartex-discord-actors = { path = "hartex-discord-actors" }
hartex-discord-utils = { path = "hartex-discord-utils" }
hartex-tracing = { path = "../rust-utilities/hartex-tracing" }

[workspace.lints.clippy]
pedantic = "deny"

[workspace.lints.rust]
unsafe_code = "forbid"
warnings = "deny"

[profile.release]
codegen-units = 1
debug = true
lto = "fat"

[workspace]
members = [
    "hartex-termios-utils",
    "hartex-tracing",
    "hartex-version",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.94.0"
version = "0.17.0"

[workspace.dependencies]
ansi_term = "0.12.1"
color-eyre = "0.6.5"
git-version = "0.3.9"
libc = "0.2.179"
time = "0.3.44"
tracing-core = "0.1.36"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.22", features = ["registry", "time"] }

[workspace.lints.clippy]
allow_attributes_without_reason = "forbid"
pedantic = "deny"

[workspace.lints.rust]
unsafe_code = "deny"
warnings = "deny"

[profile.release]
codegen-units = 1
debug = true
lto = "fat"

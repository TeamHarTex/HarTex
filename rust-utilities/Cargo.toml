[workspace]
members = [
    "hartex-termios-utils",
    "hartex-tracing",
    "hartex-version",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.96.0"
version = "0.17.0"

[workspace.dependencies]
ansi_term = "0.12.1"
color-eyre = "0.6.5"
git-version = "0.3.9"
libc = "0.2.186"
time = "0.3.47"
tracing-core = "0.1.36"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", features = ["registry", "time"] }

[workspace.lints.clippy]
allow_attributes_without_reason = "forbid"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
pedantic = { level = "deny", priority = -1 }
struct_field_names = "allow"

[workspace.lints.rust]
unsafe_code = "deny"
warnings = "deny"

[profile.release]
codegen-units = 1
debug = true
lto = "fat"
